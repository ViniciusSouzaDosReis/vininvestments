name: Help Center Web

on:
  push:
    branches: [main]
    paths:
      - "apps/help-center/**"
      - "scripts/deploy/**"
      - "Makefile"
      - ".github/workflows/ci-help-center-web.yml"

jobs:
  build:
    name: Validate Help Center
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/help-center
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/help-center/package-lock.json
      - run: npm ci
      - run: npm run build

  deploy:
    name: Deploy Help Center
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Deploy
        run: make deploy-help-center
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_HELP_CENTER_PROJECT_ID: ${{ secrets.RAILWAY_HELP_CENTER_PROJECT_ID }}
          RAILWAY_HELP_CENTER_SERVICE_ID: ${{ secrets.RAILWAY_HELP_CENTER_SERVICE_ID }}
